name: Import blog drafts

# When a Markdown post is committed to content/blog/, load it into the live
# blog database as a DRAFT. Publish it from visualschedule.app/admin/blog.
on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SQL from Markdown posts
        run: node scripts/blog-to-sql.mjs content/blog > blog-import.sql

      - name: Load drafts into the blog database
        working-directory: next-app
        run: |
          if [ ! -s ../blog-import.sql ] || [ "$(tr -d '[:space:]' < ../blog-import.sql)" = "" ]; then
            echo "No posts to import."; exit 0
          fi
          npx --yes wrangler@4 d1 execute visual-schedules-db --remote --file=../blog-import.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
