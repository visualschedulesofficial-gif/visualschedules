name: Add Missing Subscription Column

# Manual "Run workflow" button in the Actions tab — no laptop needed.
#
# Why this instead of "d1 migrations apply":
# This database was created directly from setup-database.sql, so Cloudflare has
# no record of any migration ever running. "migrations apply" therefore tries to
# replay EVERY migration from the beginning, starting with CREATE TABLE
# statements for tables that already exist — which fails immediately.
#
# So this runs the single statement that's actually missing: the expires_at
# column on subscriptions. Without it, saving a paid subscription fails, which
# is why a successful payment never unlocked anything.
on:
  workflow_dispatch:

jobs:
  add-column:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show subscriptions columns BEFORE
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: next-app
          command: d1 execute visual-schedules-db --remote --command "PRAGMA table_info(subscriptions);" --yes

      - name: Add the expires_at column
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: next-app
          command: d1 execute visual-schedules-db --remote --command "ALTER TABLE subscriptions ADD COLUMN expires_at text;" --yes

      - name: Show subscriptions columns AFTER
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: next-app
          command: d1 execute visual-schedules-db --remote --command "PRAGMA table_info(subscriptions);" --yes
