name: Deploy to Cloudflare

on:
  push:
    branches: [main, nextjs-migration]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npx next build

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Give the app its Claude translation key (if provided)
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          else
            echo "No ANTHROPIC_API_KEY secret set - skipping (translations use fallback)"
          fi
          # Check BOTH keys. Previously only KEY_ID was checked, so if the
          # secret was blank an empty value got pushed with no warning — the
          # app then failed at checkout with "missing RAZORPAY_KEY_SECRET".
          if [ -n "$RAZORPAY_KEY_ID" ] && [ -n "$RAZORPAY_KEY_SECRET" ]; then
            echo "$RAZORPAY_KEY_ID" | npx wrangler secret put RAZORPAY_KEY_ID
            echo "$RAZORPAY_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET
            echo "Razorpay keys uploaded."
          elif [ -n "$RAZORPAY_KEY_ID" ]; then
            echo "::error::RAZORPAY_KEY_ID is set but RAZORPAY_KEY_SECRET is EMPTY."
            echo "::error::Payments will fail. Add RAZORPAY_KEY_SECRET in Settings > Secrets and variables > Actions, then re-run."
            exit 1
          else
            echo "No RAZORPAY keys set - skipping (payments disabled)"
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # NOTE: this database was created directly from setup-database.sql, so
      # Cloudflare has no record of migrations ever running. "migrations apply"
      # therefore tries to replay everything from the start — including CREATE
      # TABLE for tables that already exist — and fails. The deploy itself
      # (above) has already succeeded by this point, so a failure here must not
      # mark the whole deploy as failed. Schema changes are applied deliberately
      # via the "Add Missing Subscription Column" workflow instead.
      - name: Apply D1 migrations (optional — never fails the deploy)
        continue-on-error: true
        run: npx wrangler d1 migrations apply visual-schedules-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
