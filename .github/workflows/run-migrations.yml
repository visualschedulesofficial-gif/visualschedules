name: Check Payment Status

# Manual "Run workflow" button — READ ONLY, changes nothing.
#
# Uses --file rather than an inline --command: quoted SQL passed inline gets
# mangled by the action's argument splitting, which is why the previous
# attempt failed before it ever reached the database.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show payment and account data
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: next-app
          command: d1 execute visual-schedules-db --remote --file=../check-payment.sql --yes
